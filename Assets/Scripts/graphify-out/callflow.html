<title>Dharitz Call Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(22,27,34,.92);backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 20px;z-index:10;border-bottom:1px solid #30363d;gap:14px}
#toolbar h1{font-size:15px;font-weight:600;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:11px;background:#30363d;padding:2px 8px;border-radius:10px;color:#8b949e}
#toolbar label{font-size:12px;color:#8b949e;display:flex;align-items:center;gap:5px;cursor:pointer}
#toolbar input[type=checkbox]{accent-color:#58a6ff}
#search{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:4px 10px;border-radius:6px;font-size:12px;width:180px;outline:none}
#search:focus{border-color:#58a6ff}
#tip{position:fixed;pointer-events:none;background:rgba(22,27,34,.95);border:1px solid #30363d;border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.6;z-index:20;display:none;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#legend{position:fixed;bottom:16px;left:16px;background:rgba(22,27,34,.9);border:1px solid #30363d;border-radius:8px;padding:12px 16px;font-size:11px;z-index:10}
#legend h3{font-size:12px;margin-bottom:6px;color:#8b949e}
.lr{display:flex;align-items:center;gap:6px;margin:3px 0}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
svg{display:block}
</style>
</head>
