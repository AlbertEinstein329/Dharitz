behaviors:
  DarithzBrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-1
      beta_schedule: linear 
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings: 
      normalize: true # Obligatorio si usas VectorSensor con Ids o floats variados
      hidden_units: 256 # Duplicamos la capacidad cognitiva
      num_layers: 3 # Profundidad necesaria para lógica topológica
      vis_encode_type: match3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity: # <--- INYECCIÓN PARA EVITAR EL ÓPTIMO LOCAL COBARDE
          strength: 0.05
          gamma: 0.99
          learning_rate: 3.0e-4
          network_settings:
            vis_encode_type: match3
    max_steps: 3000000 # Aumentado, la red más grande tardará más en converger
    time_horizon: 256 # Visión a largo plazo para relacionar secuencias de turnos
    summary_freq: 10000