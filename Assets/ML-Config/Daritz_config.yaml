behaviors:
  DarithzBrain_V8:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3 
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings: 
      normalize: true
      vis_encode_type: match3 
      hidden_units: 512 
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000 
    time_horizon: 256 
    summary_freq: 10000